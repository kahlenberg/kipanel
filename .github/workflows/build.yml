name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: ./package.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: kipanel-pcm-${{ matrix.platform }}
          path: dist/kipanel-pcm-${{ matrix.platform }}.zip
          if-no-files-found: error

      # pushing a tag like v0.1.0 publishes the zips as a GitHub release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/kipanel-pcm-${{ matrix.platform }}.zip
